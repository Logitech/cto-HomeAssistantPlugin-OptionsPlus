name: Draft plugin release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  draft:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: artifacts/candidates
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore packaging tool
        run: dotnet tool restore
      - name: Validate tag and assemble OS payloads
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import zipfile

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("Expected an existing vMAJOR.MINOR.PATCH tag")
          packages = sorted(pathlib.Path("artifacts/candidates").glob("*/HomeAssistant.lplug4"))
          if {package.parent.name for package in packages} != {"plugin-windows-2022", "plugin-macos-15"}:
              raise SystemExit("Both Windows and arm64 macOS candidates are required")
          payloads = []
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  metadata = archive.read("metadata/LoupedeckPackage.yaml").decode("utf-8-sig")
                  version = re.search(r"^version:\s*(\S+)", metadata, re.MULTILINE).group(1)
                  if tag != "v" + version:
                      raise SystemExit("The tag must match the packaged manifest version")
                  payload = {name: archive.read(name) for name in archive.namelist()
                             if not name.endswith("/") and name != "metadata/PackageHash.bin"}
                  if any(pathlib.PurePosixPath(name).is_absolute() or ".." in pathlib.PurePosixPath(name).parts for name in payload):
                      raise SystemExit("Invalid package path")
                  for name, data in payload.items():
                      if name.endswith((".yaml", ".svg")):
                          payload[name] = data.decode("utf-8-sig").replace("\r\n", "\n").encode()
                  payloads.append(payload)
          assets = [{name: data for name, data in payload.items() if not name.startswith("bin/")}
                    for payload in payloads]
          if assets[0] != assets[1]:
              raise SystemExit("Shared package metadata/assets differ")
          staging = pathlib.Path("artifacts/release-package")
          staging.mkdir(parents=True, exist_ok=False)
          combined = dict(payloads[0])
          if payloads[0] != payloads[1]:
              combined = dict(assets[0])
              for package, payload in zip(packages, payloads):
                  platform = "win" if package.parent.name == "plugin-windows-2022" else "mac"
                  for name, data in payload.items():
                      if name.startswith("bin/"):
                          combined["bin/" + platform + "/" + name[4:]] = data
              metadata = combined["metadata/LoupedeckPackage.yaml"].decode("utf-8-sig")
              for platform, folder in (("Win", "win"), ("Mac", "mac")):
                  metadata, count = re.subn(r"^pluginFolder" + platform + r": bin\s*$",
                                           "pluginFolder" + platform + ": bin/" + folder,
                                           metadata, flags=re.MULTILINE)
                  if count != 1:
                      raise SystemExit("Expected the shared-bin source manifest")
              combined["metadata/LoupedeckPackage.yaml"] = metadata.encode()
          for name, data in combined.items():
              destination = staging / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          PY
      - name: Pack and verify release candidate
        run: |
          dotnet tool run logiplugintool pack artifacts/release-package artifacts/HomeAssistant.lplug4
          dotnet tool run logiplugintool verify artifacts/HomeAssistant.lplug4
          cd artifacts
          sha256sum HomeAssistant.lplug4 > SHA256SUMS
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/HomeAssistant.lplug4 artifacts/SHA256SUMS \
            --verify-tag --draft --title "Home Assistant $RELEASE_TAG" \
            --notes "Release candidate only. Before publishing, complete and attach the macOS 14/current macOS Apple Silicon host and Windows hardware acceptance record in docs/macos-support.md. Hosted SDK rendering checks do not certify the installed Options+ host. Marketplace submission is a separate manual step."
